name: CI

on:
  push:
    branches:
      - main
  pull_request:
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: read

jobs:
  test-and-lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          # Development tools require a newer Go than the application's minimum.
          go-version: '1.27.x'
          cache-dependency-path: go.sum

      - name: Lint
        run: make lint

      - name: Audit
        run: make audit

      - name: Test
        run: make test

      - name: Build
        run: make build
